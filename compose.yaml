# =============================================================================
# omnivoice.cpp — tts-server auf dem Pascal-GPU-Host (gputainer / 1080 Ti)
#
# Zielhost:   ollama.ugin.herr-schreiber.com  (a.k.a. "gputainer")
#   - Die 1080 Ti ist GPU 0  ->  device_ids: ['0']
#   - Die GGUF-Modelle liegen auf dem Host unter /opt/1080ki/models
#     (read-only nach /opt/models in den Container gemountet).
#
# Image:      omnivoice-pascal:1080ti  (aus dem Dockerfile dieses Repos)
#
# Start:      docker compose -f compose.yaml up -d
# =============================================================================

services:
  omnivoice:
    image: omnivoice-pascal:1080ti
    container_name: omnivoice
    restart: unless-stopped

    # tts-server lauscht intern auf 0.0.0.0:8080 und wird auf den Host
    # gepublished (Port 8015).
    ports:
      - "8015:8080"

    # Modelle: Host-Dateien, read-only, exakt dort wo sie liegen
    # (Host: /opt/1080ki/models  ->  Container: /opt/models).
    volumes:
      - /opt/1080ki/models:/opt/models:ro

    # Pascal 1080 Ti = GPU 0. Explizit device_ids, nicht count.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    # --model / --codec : die GGUFs aus /opt/models (gemountet).
    # --device CUDA0     : explizit die 1080 Ti (nicht "best available").
    # --host 0.0.0.0     : Binary-default ist 127.0.0.1; für den published
    #                       Port muss der Server auf 0.0.0.0 lauschen.
    command:
      - --model
      - /opt/models/omnivoice-base-Q8_0.gguf
      - --codec
      - /opt/models/omnivoice-tokenizer-Q8_0.gguf
      - --device
      - CUDA0
      - --host
      - 0.0.0.0
      - --port
      - "8080"

    # Liveness auf dem /health-Endpoint. start_period großzügig: das
    # Base-Modell (Q8_0) + Tokenizer (F32) dauert beim ersten Load ~30-60 s.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
